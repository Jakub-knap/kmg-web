<body class="galeria-stranka">

        <button type="button" aria-pressed="false" data-kategoria="strechy">Strechy</button>
        <button type="button" aria-pressed="false" data-kategoria="chaty">Chaty</button>

        <button type="button" aria-pressed="false" data-kategoria="altanky">Altánky</button>
        <button type="button" aria-pressed="false" data-kategoria="pergoly">Pergoly</button>
        <button type="button" aria-pressed="false" data-kategoria="drevodomy">Drevodomy</button>

    <div class="obal">

  <dialog class="lupa" aria-label="Zväčšená fotka">
    <div class="lupa__hore"><span data-lupa-pocet></span><button type="button" data-lupa-zavriet>Zavrieť</button></div>
